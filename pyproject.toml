[project]
name = "spotify-add-song-button"
version = "0.1.0"
description = "Serverless API to add the currently playing Spotify track to a default playlist."
readme = "README.md"
authors = [
    { name = "Corey Hermanson" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.44.3",
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "mangum>=0.22.0",
    "pydantic-settings>=2.16.3",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

